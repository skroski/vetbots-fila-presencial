<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Fila Presencial</title>
    <!--FILA:HEAD-->
    <script>
      // Tema antes da primeira pintura (sem flash): preferência salva ou a do sistema
      try {
        var t = localStorage.getItem('fila-tema');
        var escuro = t === 'dark' || (t !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.setAttribute('data-theme', escuro ? 'vetbots-dark' : 'vetbots');
      } catch (e) { document.documentElement.setAttribute('data-theme', 'vetbots'); }
    </script>
  </head>
  <body class="bg-base-200 text-base-content antialiased selection:bg-brand-500 selection:text-white">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
