# Sobe o sistema inteiro com:  docker compose up -d --build
# Os dados (banco SQLite, logotipo e vídeos) ficam na pasta ./data deste projeto.
services:
  fila-presencial:
    build: .
    container_name: vetbots-fila-presencial
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    volumes:
      - ./data:/data
    environment:
      # Fuso da clínica: define a virada do dia (a numeração das senhas recomeça à meia-noite local)
      - TZ=${TZ:-America/Sao_Paulo}
      # PIN opcional para proteger a tela de Ajustes (deixe vazio para não pedir)
      - ADMIN_PIN=${ADMIN_PIN:-}
      # Limite de tamanho por vídeo enviado, em MB
      - MAX_VIDEO_MB=${MAX_VIDEO_MB:-2048}
